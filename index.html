<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Distribuidora Max</title>
    <link rel="shortcut icon" type="image/x-icon" href="./favicon.ico" />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      :root {
        --color-primary: #ff6b6b;
        --color-primary-dark: #e04f4f;
        --color-secondary: #ffd166;
        --color-background-light: #fdfbf0;
        --color-background-medium: #f8f5e9;
        --color-text-dark: #333333;
        --color-text-medium: #666666;
        --color-border: #e0e0e0;
        --color-shadow-light: rgba(0, 0, 0, 0.05);
        --color-shadow-medium: rgba(0, 0, 0, 0.1);
      }

      body {
        background-color: var(--color-background-medium);
        font-family: "Inter", sans-serif;
        color: var(--color-text-dark);
        line-height: 1.6;
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: "Playfair Display", serif;
        color: var(--color-text-dark);
      }

      .header-logo {
        font-weight: 700;
        font-size: 1.75rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        color: var(--color-text-dark);
        transition: color 0.3s ease;
      }
      .header-logo:hover {
        color: var(--color-primary);
      }
      .header-logo svg {
        stroke: var(--color-primary);
        width: 2.25rem;
        height: 2.25rem;
        transition: stroke 0.3s ease;
      }
      .header-logo:hover svg {
        stroke: var(--color-primary-dark);
      }

      .btn-pink {
        background-color: var(--color-primary);
        color: #fff;
        font-weight: 600;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
        box-shadow: 0 4px 8px var(--color-shadow-light);
      }
      .btn-pink:hover {
        background-color: var(--color-primary-dark);
        transform: translateY(-2px);
        box-shadow: 0 6px 12px var(--color-shadow-medium);
      }
      .btn-pink:active {
        transform: translateY(0);
        box-shadow: 0 2px 4px var(--color-shadow-light);
      }

      .card {
        background: var(--color-background-light);
        border-radius: 1rem;
        box-shadow: 0 8px 20px var(--color-shadow-light);
        transition: box-shadow 0.3s ease-in-out, transform 0.3s ease-in-out;
        overflow: hidden;
      }
      .card:hover {
        box-shadow: 0 16px 30px var(--color-shadow-medium);
        transform: translateY(-5px);
      }

      .input-focus:focus {
        outline: none;
        border-color: var(--color-primary);
        box-shadow: 0 0 0 4px rgba(255, 107, 107, 0.2);
      }

      .sidebar::-webkit-scrollbar {
        width: 8px;
      }
      .sidebar::-webkit-scrollbar-thumb {
        background: var(--color-primary);
        border-radius: 100px;
      }

      .notif-bubble {
        background-color: var(--color-primary);
        color: white;
        font-weight: 700;
        font-size: 0.7rem;
        width: 22px;
        height: 22px;
        border-radius: 9999px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        top: -10px;
        right: -10px;
        pointer-events: none;
        user-select: none;
        border: 3px solid var(--color-background-light);
        box-shadow: 0 2px 5px var(--color-shadow-medium);
      }

      .nav-button {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--color-text-medium);
        font-weight: 500;
        transition: color 0.3s ease, transform 0.2s ease;
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
      }
      .nav-button:hover {
        color: var(--color-primary);
        transform: translateY(-1px);
        background-color: rgba(255, 107, 107, 0.05);
      }
      .nav-button svg {
        stroke: currentColor;
        width: 1.5rem;
        height: 1.5rem;
        transition: stroke 0.3s ease;
      }
    </style>
  </head>
  <body class="relative min-h-screen flex flex-col">
    <!-- HEADER -->
    <header class="bg-[var(--color-background-light)] py-5 border-b border-[var(--color-border)] sticky top-0 z-30 shadow-lg">
      <div class="container mx-auto px-8 flex justify-between items-center">
        <a href="index.html" class="header-logo" aria-label="Distribuidora Max logo">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke-width="1.5" stroke="currentColor" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9.75L12 3l9 6.75v10.5a1.5 1.5 0 0 1-1.5 1.5h-15a1.5 1.5 0 0 1-1.5-1.5v-10.5z" />
            <path d="M9 22.5v-6h6v6" />
          </svg>
          Distribuidora Max
        </a>
        <nav class="flex items-center gap-6 text-base md:text-lg">
          <button id="cartBtn" aria-label="Carrito de compras" class="relative nav-button">
            <svg fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <path d="M3 3h2l.4 2M7 13h10l4-8H5.4" />
              <circle cx="7" cy="21" r="1" />
              <circle cx="17" cy="21" r="1" />
            </svg>
            <span class="notif-bubble hidden" id="cartCount">0</span>
            <span class="hidden md:inline">Carrito</span>
          </button>
        </nav>
      </div>
    </header>

    <!-- BANNER -->
    <div>
      <section class="relative max-w-6xl mx-auto mt-8 shadow-xl rounded-xl overflow-hidden">
        <img
          src="https://salice.com.ar/wp-content/uploads/2023/06/banner-nuevo.png"
          alt="Banner decorativo"
          class="w-full object-cover h-64 md:h-80"
        />
        <h1 class="absolute inset-0 flex justify-center items-end pb-6 text-white font-serif font-semibold drop-shadow-lg select-none pointer-events-none text-4xl sm:text-5xl md:text-6xl">
          Distribuidora Max
        </h1>
      </section>
    </div>

    <!-- MAIN CONTENT -->
    <main class="container mx-auto px-4 flex-grow mt-8 mb-16">
      <!-- Product Search and Filters -->
      <section id="productShowcase" class="mb-12 bg-[var(--color-background-light)] rounded-2xl p-8 shadow-xl">
        <h2 class="text-center text-4xl font-serif mb-8 text-[var(--color-text-dark)]">
          Nuestros Productos
        </h2>
        <form id="filtersForm" class="flex flex-col md:flex-row gap-5 p-6 mb-8 bg-white rounded-xl shadow-inner">
          <input
            type="search"
            id="searchInput"
            placeholder="Buscar productos..."
            class="flex-1 border border-[var(--color-border)] rounded-lg px-5 py-3 input-focus text-[var(--color-text-dark)] placeholder-[var(--color-text-medium)]"
            aria-label="Buscar productos"
          />
          <select
            id="categorySelect"
            class="border border-[var(--color-border)] rounded-lg px-5 py-3 input-focus text-[var(--color-text-dark)]"
            aria-label="Filtrar por categoría"
          >
            <option value="all">Todas las categorías</option>
            <option value="Raza">Raza</option>
            <option value="Gran pastor">Gran pastor</option>
            <option value="Pedigree">Pedigree</option>
            <option value="Sabrositos">Sabrositos</option>
            <option value="Otros">Otros</option>
          </select>
          <select
            id="priceSelect"
            class="border border-[var(--color-border)] rounded-lg px-5 py-3 input-focus text-[var(--color-text-dark)]"
            aria-label="Filtrar por precio"
          >
            <option value="all">Todos los precios</option>
            <option value="under30000">Menos de $30.000</option>
            <option value="30000to35000">$30.000 - $35.000</option>
            <option value="over35000">Más de $35.000</option>
          </select>
        </form>
        <!-- Product Grid -->
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-3 gap-6"></div>
      </section>
    </main>

    <!-- FOOTER -->
    <footer class="bg-[var(--color-background-light)] mt-auto py-12 shadow-inner border-t border-[var(--color-border)]">
      <div class="container mx-auto px-8 grid grid-cols-1 md:grid-cols-3 gap-12 text-center md:text-left text-base font-inter">
        <div class="flex flex-col items-center md:items-start gap-3">
          <div class="flex items-center gap-3 justify-center md:justify-start font-semibold text-xl text-[var(--color-text-dark)]">
            Seguinos
          </div>
          <span class="text-[var(--color-text-medium)]">@Distribuidora_Max_</span>
        </div>
        <div class="flex flex-col items-center md:items-start gap-3">
          <div class="flex items-center gap-3 justify-center md:justify-start font-semibold text-xl text-[var(--color-text-dark)]">
            Medios de pago
          </div>
          <span class="text-[var(--color-text-medium)]">Transferencias<br />Efectivo</span>
        </div>
        <div class="flex flex-col items-center md:items-start gap-3">
          <div class="flex items-center gap-3 justify-center md:justify-start font-semibold text-xl text-[var(--color-text-dark)]">
            Contactanos
          </div>
          <span class="text-[var(--color-text-medium)]">+54 9 3814 17-9467<br />San Miguel de Tucumán</span>
        </div>
      </div>
      <div class="border-t border-[var(--color-border)] mt-10 pt-6 text-center text-sm text-[var(--color-text-medium)]">
        © 2025 Distribuidora Max. Todos los derechos reservados.
      </div>
    </footer>

    <!-- CART SIDEBAR -->
    <aside id="cartSidebar" class="fixed top-0 right-0 w-full md:w-96 h-full bg-[var(--color-background-light)] shadow-2xl transform translate-x-full transition-transform duration-300 z-50 flex flex-col sidebar">
      <header class="p-6 flex justify-between items-center border-b border-[var(--color-border)]">
        <h3 class="text-2xl font-semibold font-serif text-[var(--color-text-dark)]">Tu Carrito</h3>
        <button id="closeCart" aria-label="Cerrar carrito" class="text-[var(--color-text-medium)] hover:text-[var(--color-primary)] transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" class="w-7 h-7">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </header>

      <!-- Lista de productos añadidos -->
      <div id="cartItems" class="flex-grow overflow-y-auto p-6 space-y-4"></div>

      <!-- FORMULARIO CON DATOS DEL CLIENTE -->
      <div class="px-6 py-4 bg-gray-50 border-t border-[var(--color-border)]">
        <h4 class="text-sm font-bold text-gray-700 mb-2">Datos para el envío:</h4>
        <div class="space-y-2">
          <input id="clientName" type="text" placeholder="Tu Nombre Completo" class="w-full text-sm p-2 border rounded border-gray-300 focus:outline-none focus:border-red-400" />
          <input id="clientPhone" type="tel" placeholder="Teléfono de contacto" class="w-full text-sm p-2 border rounded border-gray-300 focus:outline-none focus:border-red-400" />
          <input id="clientAddress" type="text" placeholder="Dirección / Localidad" class="w-full text-sm p-2 border rounded border-gray-300 focus:outline-none focus:border-red-400" />
        </div>
      </div>

      <footer class="p-6 border-t border-[var(--color-border)] bg-white">
        <div class="flex justify-between font-semibold font-serif mb-4 text-xl text-[var(--color-text-dark)]">
          <span>Total:</span><span id="cartTotal">$0.00</span>
        </div>

        <button id="orderWhatsappBtn" class="btn-pink w-full rounded-lg py-3 mb-2 flex items-center justify-center gap-3 text-base">
          Finalizar compra por WhatsApp
        </button>
        <button id="continueShoppingBtn" class="bg-transparent border border-[var(--color-border)] rounded-lg py-2.5 w-full text-[var(--color-text-dark)] font-semibold hover:bg-[var(--color-background-medium)] transition-colors text-sm">
          Seguir comprando
        </button>
      </footer>
    </aside>

    <!-- JAVASCRIPT LOGIC -->
    <script>
      "use strict";

      // Productos iniciales completos
      let products = [
        {
          id: "1",
          name: "RAZA ADULTO MORDIDA PEQUEÑA 15KG",
          description: "Brinda a tu perro adulto de raza pequeña una nutrición completa y balanceada con nuestro Alimento Raza Perros Adultos Razas Pequeñas.",
          price: 25500,
          category: "Raza",
          imageUrl: "https://http2.mlstatic.com/D_NQ_NP_786111-MLA90658499616_082025-O.webp",
        },
        {
          id: "2",
          name: "RAZA CACHORRO 15KG",
          description: "Alimento Raza para Perros Cachorros Sabor Carne, Cereales y Leche x 15Kg",
          price: 29500,
          category: "Raza",
          imageUrl: "https://acdn-us.mitiendanube.com/stores/001/149/130/products/raza-cach1-3546e83f38f97b45aa16432083016626-480-0.webp",
        },
        {
          id: "3",
          name: "RAZA ADULTO 21KG",
          description: "El alimento balanceado para perros RAZA sabor carne es el preferido por el paladar canino con complejo vitamínico mineral con Omega 3 y 6.",
          price: 35300,
          category: "Raza",
          imageUrl: "https://acdn-us.mitiendanube.com/stores/003/845/983/products/alimento-raza-perros-adultos-sabor-carne-pet-shop-animall-com-ar-bahia-blanca-29b1d83cf59229099417234157710925-1024-1024.webp",
        },
        {
          id: "4",
          name: "RAZA ADULTO 15KG",
          description: "El alimento balanceado para perros RAZA sabor carne con complejo vitamínico mineral con Omega 3 y 6 para huesos sanos.",
          price: 25500,
          category: "Raza",
          imageUrl: "https://masonlineprod.vtexassets.com/arquivos/ids/158216-800-auto?v=637835127847900000&width=800&height=auto&aspect=true",
        },
        {
          id: "5",
          name: "GRAN PASTOR ADULTO 21KG",
          description: "Alimento premium con 28% de proteína, Omega 3 y 6 para articulaciones sanas y pelaje brillante.",
          price: 38500,
          category: "Gran pastor",
          imageUrl: "https://encrypted-tbn2.gstatic.com/shopping?q=tbn:ANd9GcSoBYiEoUZ2ObCl5r0nQyNsVlwM_K3YXRAxlIQUauy4jM1UHsSEclWpijezy-FTtbkLdc1e5bOYXO8U005gn_LH_g9U9AKS0oKuH1kDlDg6sRNSnS3gEkQW9w",
        }
      ];

      let cart = [];

      // Elementos DOM
      const productGrid = document.getElementById("productGrid");
      const cartBtn = document.getElementById("cartBtn");
      const cartSidebar = document.getElementById("cartSidebar");
      const closeCart = document.getElementById("closeCart");
      const cartItemsContainer = document.getElementById("cartItems");
      const cartTotal = document.getElementById("cartTotal");
      const cartCount = document.getElementById("cartCount");
      const searchInput = document.getElementById("searchInput");
      const categorySelect = document.getElementById("categorySelect");
      const priceSelect = document.getElementById("priceSelect");
      const orderWhatsappBtn = document.getElementById("orderWhatsappBtn");
      const continueShoppingBtn = document.getElementById("continueShoppingBtn");

      // Renderizar productos en la tienda
      function renderProducts(items) {
        productGrid.innerHTML = "";
        if (items.length === 0) {
          productGrid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-8">No se encontraron productos.</p>`;
          return;
        }
        items.forEach((product) => {
          const card = document.createElement("div");
          card.className = "card p-6 flex flex-col justify-between";
          card.innerHTML = `
            <div>
              <img src="${product.imageUrl}" alt="${product.name}" class="w-full h-48 object-contain bg-white rounded-lg p-2 mb-4" />
              <span class="text-xs font-semibold px-2.5 py-1 bg-[var(--color-secondary)] rounded-full text-gray-800">${product.category}</span>
              <h3 class="text-xl font-bold mt-3 mb-2 text-[var(--color-text-dark)]">${product.name}</h3>
              <p class="text-sm text-[var(--color-text-medium)] mb-4 line-clamp-2">${product.description}</p>
            </div>
            <div>
              <div class="text-xl font-bold text-[var(--color-text-dark)] mb-4">$${product.price.toLocaleString()}</div>
              <button onclick="addToCart('${product.id}')" class="btn-pink w-full py-2.5 rounded-lg">Agregar al carrito</button>
            </div>
          `;
          productGrid.appendChild(card);
        });
      }

      // Filtrar productos
      function filterProducts() {
        const query = searchInput.value.toLowerCase();
        const category = categorySelect.value;
        const priceFilter = priceSelect.value;

        const filtered = products.filter((p) => {
          const matchesQuery = p.name.
